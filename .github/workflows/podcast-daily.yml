name: Daily free realistic podcast UGC
on:
  schedule:
    - cron: "25 1,5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-podcast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  podcast-status:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.status.outputs.podcast_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check existing podcast asset
        id: status
        env:
          MARKETING_UPLOAD_KEY: ${{ secrets.MARKETING_UPLOAD_KEY }}
          MARKETING_UPLOAD_URL: ${{ secrets.MARKETING_UPLOAD_URL }}
        run: python3 marketing/automation/cloud_status.py
  ugc-prepare:
    needs: podcast-status
    if: github.event.repository.private == false && needs.podcast-status.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      day: ${{ steps.plan.outputs.day }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Plan isolated review files
        id: plan
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,timedelta
          import os
          day=datetime.now(timezone(timedelta(hours=4))).date().isoformat()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('day='+day+'\n'+'build=daily-podcast-'+os.environ['GITHUB_RUN_ID']+'\n')
          PY
      - name: Render the new script with the existing voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1
          python -m pip install -r marketing/automation/requirements.txt
          python marketing/automation/bootstrap.py
          python marketing/automation/ugc_voice.py --podcast
      - name: Save generic review inputs
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_BUILD: ${{ steps.plan.outputs.build }}
          MEDIA_DAY: ${{ steps.plan.outputs.day }}
        run: |
          gh release create "$MEDIA_BUILD" --draft --target main --title 'New script UGC - owner review only' --notes 'Fictional presenter. No posting or media upload credentials in this workflow.'
          gh release upload "$MEDIA_BUILD" "state/daily-marketing/$MEDIA_DAY-ugc.wav" "state/daily-marketing/$MEDIA_DAY-ugc.json"
  ugc-render:
    needs: ugc-prepare
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        clip: [0, 1, 2, 3, 4, 5]
        half: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Fetch generic speech and verified animation source
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_BUILD: ${{ needs.ugc-prepare.outputs.build }}
        run: |
          mkdir -p state/daily-marketing
          gh release download "$MEDIA_BUILD" --pattern '*.wav' --pattern '*.json' --dir state/daily-marketing
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libsndfile1
          python marketing/automation/prepare_sadtalker.py --size 512
          python -m venv state/sadtalker-venv
          state/sadtalker-venv/bin/python -m pip install 'setuptools==69.5.1' wheel
          state/sadtalker-venv/bin/python -m pip install 'torch==1.13.1+cpu' 'torchvision==0.14.1+cpu' 'torchaudio==0.13.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          state/sadtalker-venv/bin/python -m pip install -r state/SadTalker/requirements.txt -c marketing/automation/sadtalker-constraints.txt
      - name: Render detailed presenter shot with natural head movement
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          MEDIA_DAY: ${{ needs.ugc-prepare.outputs.day }}
          CLIP_INDEX: ${{ matrix.clip }}
          SUBSHOT: ${{ matrix.half }}
        run: state/sadtalker-venv/bin/python marketing/automation/ugc_chunks.py render --day "$MEDIA_DAY" --index "$CLIP_INDEX" --enhanced-motion --half "$SUBSHOT"
      - name: Store this generated shot
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_BUILD: ${{ needs.ugc-prepare.outputs.build }}
          CLIP_INDEX: ${{ matrix.clip }}
          SUBSHOT: ${{ matrix.half }}
        run: |
          cp "state/ugc-clips/clip-$CLIP_INDEX.mp4" "state/ugc-clips/clip-$CLIP_INDEX-$SUBSHOT.mp4"
          gh release upload "$MEDIA_BUILD" --clobber "state/ugc-clips/clip-$CLIP_INDEX-$SUBSHOT.mp4"
  ugc-publish:
    needs: [ugc-prepare, ugc-render]
    if: needs.ugc-render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Assemble all six shots with the original uncut speech
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_BUILD: ${{ needs.ugc-prepare.outputs.build }}
          MEDIA_DAY: ${{ needs.ugc-prepare.outputs.day }}
        run: |
          mkdir -p state/daily-marketing state/ugc-clips
          gh release download "$MEDIA_BUILD" --pattern '*.wav' --pattern '*.json' --dir state/daily-marketing
          gh release download "$MEDIA_BUILD" --pattern 'clip-*.mp4' --dir state/ugc-clips
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install -r marketing/automation/requirements.txt
          python marketing/automation/bootstrap.py
          python marketing/automation/ugc_chunks.py assemble --day "$MEDIA_DAY" --subshots
      - name: Validate and save the finished review video without posting
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_BUILD: ${{ needs.ugc-prepare.outputs.build }}
          MEDIA_DAY: ${{ needs.ugc-prepare.outputs.day }}
        run: |
          python marketing/automation/ugc_render.py --sadtalker state/SadTalker --finish-only --render-only
          gh release upload "$MEDIA_BUILD" --clobber "state/daily-marketing/$MEDIA_DAY-ugc.mp4"
      - name: Upload only this bounded daily podcast asset
        env:
          MARKETING_UPLOAD_KEY: ${{ secrets.MARKETING_UPLOAD_KEY }}
          MARKETING_UPLOAD_URL: ${{ secrets.MARKETING_UPLOAD_URL }}
          MEDIA_DAY: ${{ needs.ugc-prepare.outputs.day }}
        run: |
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'marketing/automation')
          from daily_video import upload
          upload(Path('state/daily-marketing')/(os.environ['MEDIA_DAY']+'-ugc.mp4'),os.environ['MEDIA_DAY'],'podcast')
          PY
