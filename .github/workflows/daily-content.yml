name: Daily free business and AI presenter content
on:
  schedule:
    - cron: '13 1 * * *'
    - cron: '13 5 * * *'
  workflow_dispatch:
    inputs:
      style_preview:
        type: boolean
        default: false
        description: Render both cartoon videos and story for inspection without uploading
      verify_only:
        type: boolean
        default: false
        description: Check existing media without generating or uploading
permissions:
  contents: read
concurrency:
  group: daily-business-content
  cancel-in-progress: false
jobs:
  approved-cartoon-videos:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check today's two videos and story
        id: ready
        env:
          MARKETING_UPLOAD_KEY: ${{ secrets.MARKETING_UPLOAD_KEY }}
          MARKETING_UPLOAD_URL: ${{ secrets.MARKETING_UPLOAD_URL }}
        run: python marketing/automation/cloud_status.py
      - name: Prepare the approved free cartoon renderer
        if: inputs.verify_only != true && (inputs.style_preview == true || ((matrix.variant == 0 && (steps.ready.outputs.business_ready != 'true' || steps.ready.outputs.story_ready != 'true')) || (matrix.variant == 1 && steps.ready.outputs.ugc_ready != 'true')))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng libsndfile1
          python -m pip install -r marketing/automation/requirements.txt
          python marketing/automation/bootstrap.py
      - name: Generate the approved-style daily video and matching story
        if: inputs.verify_only != true && (inputs.style_preview == true || ((matrix.variant == 0 && (steps.ready.outputs.business_ready != 'true' || steps.ready.outputs.story_ready != 'true')) || (matrix.variant == 1 && steps.ready.outputs.ugc_ready != 'true')))
        env:
          MARKETING_UPLOAD_KEY: ${{ secrets.MARKETING_UPLOAD_KEY }}
          MARKETING_UPLOAD_URL: ${{ secrets.MARKETING_UPLOAD_URL }}
          VIDEO_VARIANT: ${{ matrix.variant }}
          STYLE_PREVIEW: ${{ inputs.style_preview }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$STYLE_PREVIEW" = true ]; then
            python marketing/automation/daily_video.py --variant "$VIDEO_VARIANT" --render-only
            MEDIA_DAY=$(python -c 'from datetime import datetime,timezone,timedelta; print(datetime.now(timezone(timedelta(hours=4))).date().isoformat())')
            TAG="cartoon-preview-$GITHUB_RUN_ID-$VIDEO_VARIANT"
            gh release create "$TAG" --draft --target main --title 'Approved cartoon daily-style validation' --notes 'Generic demonstration only; no media upload or social publication.'
            if [ "$VIDEO_VARIANT" = 0 ]; then
              gh release upload "$TAG" "state/daily-marketing/$MEDIA_DAY.mp4" "state/daily-marketing/$MEDIA_DAY-story.mp4"
            else
              gh release upload "$TAG" "state/daily-marketing/$MEDIA_DAY-second.mp4"
            fi
          else
            python marketing/automation/daily_video.py --variant "$VIDEO_VARIANT"
          fi
